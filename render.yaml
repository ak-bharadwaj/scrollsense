services:
  - type: web
    name: scrollsense-api
    runtime: python
    buildCommand: pip install -U pip && pip install -r requirements.txt && pip install -e .
    startCommand: python -m uvicorn scrollsense.api.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: SCROLLSENSE_DATA_DIR
        value: data
